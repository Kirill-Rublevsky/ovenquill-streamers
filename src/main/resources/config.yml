stream:
  cooldown-seconds: 60
  max-url-length: 512
  max-message-length: 2000
  permission-sync-seconds: 15

platforms:
  allow-other-https: true

tab:
  enabled: true
  prefix: "⬤ "
  prefix-color: "#FF5555"
  name-color: "#C8A2FF"
  priority: 100

notifications:
  enabled: true

permissions:
  restrict-admin-during-stream: true
  fail-closed: true
  # Every granted node beginning with one of these prefixes is temporarily negated during LIVE.
  # Add prefixes used by every administrative plugin installed on your network.
  admin-prefixes:
    - "luckperms."
    - "velocity.command."
    - "minecraft.command."
    - "bukkit.command."
    - "essentials."
    - "worldedit."
    - "worldguard."
    - "coreprotect."
    - "litebans."
    - "advancedban."
    - "vanish."

storage:
  file: "streams.db"

